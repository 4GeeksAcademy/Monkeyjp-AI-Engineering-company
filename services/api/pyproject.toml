[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "tinydb>=4.9.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
seed = "seed:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["models", "repositories", "routes", "services"]
py-modules = ["main", "seed"]
